<body>
    <!-- Absolute path:- copy the img path from external sources-->
     <!-- absolute path -->
      <!-- we use ./ to get or add any files in images in the same folder -->

    <br>
    <!-- Relative path:- copy the img path from the same directory -->
     <!-- relative path -->
    <img src="https://cricket.knowledgefactor.in/wp-content/uploads/2025/06/1748980862491_Rcb.jpeg" alt="" height="300px" width="400px">
    <br>
    <!-- Anchor Tags-->
    <a href ="https://facebook.com" > FaceBook </a> //it will open in the same tab
    <br>
    <a href="https://www.netflix.com/" target="_blank">Watch Stranger Things</a> //it will open in the new tab
    <br>
</body>
